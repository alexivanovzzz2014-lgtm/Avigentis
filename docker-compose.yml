services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avigentis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avigentis}
      POSTGRES_DB: ${POSTGRES_DB:-avigentis}
    ports: ['5432:5432']
    volumes: [db_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ['6379:6379']
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    ports: ['8000:8000']
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    depends_on: [backend, redis]
  frontend:
    build: ./frontend
    env_file: .env
    depends_on: [backend]
    ports: ['3000:3000']
volumes:
  db_data:
